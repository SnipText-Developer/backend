name: Deploy

# 배포 브랜치에 병합되면 arm64 이미지를 빌드·푸시하고 운영 서버의 deploy.sh로 교체한다 (설계: docs/deploy-design.md 3절)
# - 배포 브랜치는 출시 전 develop, 출시 후 main이다 (#94에서 바꾼다)
# - 수동 실행(workflow_dispatch)에 이전 커밋 해시를 넣으면 그 태그로 되돌린다. 이미지는 새로 빌드하지 않는다
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 커밋 해시 (40자). 배포 브랜치에 포함된 커밋만 받는다'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않고 끝날 때까지 기다린다 (중간에 끊기면 서버가 반쯤 바뀐 채로 남는다)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # compose.prod.yaml의 기본 이미지와 같아야 한다. 도커 이미지 이름은 소문자만 된다
  IMAGE: ghcr.io/sniptext-developer/backend
  # SSM 명령 대상. 테라폼 출력 instance_name_tag
  INSTANCE_NAME_TAG: sniptext-prod
  HEALTH_URL: https://api.sniptext.kr/actuator/health

# 외부 액션은 태그 대신 커밋 SHA로 고정한다 (ci.yml 주석 참고)
jobs:
  deploy:
    runs-on: ubuntu-latest
    # 역할 신뢰 조건이 environment:prod라 이 환경에서 도는 작업만 AWS 권한을 받는다
    environment: prod
    timeout-minutes: 30
    steps:
      - name: 배포할 태그 정하기
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            [[ "$tag" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::커밋 해시 40자(소문자)를 넣으세요: $tag"; exit 1; }
            # 리뷰를 거쳐 배포 브랜치에 들어온 커밋만 배포한다 (다른 브랜치의 커밋 차단)
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$tag...$GITHUB_SHA" --jq .status)" \
              || { echo "::error::커밋을 찾지 못했습니다: $tag"; exit 1; }
            [[ "$status" == "ahead" || "$status" == "identical" ]] \
              || { echo "::error::$GITHUB_REF_NAME 에 포함된 커밋이 아닙니다: $tag ($status)"; exit 1; }
          else
            tag="$GITHUB_SHA"
          fi
          echo "value=$tag" >>"$GITHUB_OUTPUT"
          echo "배포 태그: $tag"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.value }}
          persist-credentials: false

      - name: 이미지 빌더 설정
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: GHCR 로그인
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 태그 = 커밋 해시. 브랜치 이름 태그는 참고용이고 배포에는 쓰지 않는다 (latest로 배포하지 않음)
      # x86 실행기에서 빌드한다. 실행 단계에 RUN이 없어 QEMU가 필요 없다 (Dockerfile 주석 참고)
      - name: arm64 이미지 빌드·푸시
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 이미지 확인 (되돌리기)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null \
            || { echo "::error::레지스트리에 $IMAGE:$TAG 이미지가 없습니다"; exit 1; }

      - name: AWS 역할 위임 (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 이미지 태그와 배포 설정을 같은 커밋으로 묶는다 (설계 4-4)
      - name: 배포 파일 업로드
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          TAG: ${{ steps.tag.outputs.value }}
        run: aws s3 cp --only-show-errors --recursive deploy/ "s3://$BUCKET/$TAG/"

      # 결과 출력은 공개 로그에 남는다. deploy.sh는 비밀값을 출력하지 않는다
      - name: 서버 배포 (SSM)
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail

          # 서버에서 실행할 명령. S3에서는 실행 권한이 사라지므로 bash로 실행한다
          jq -n --arg bucket "$BUCKET" --arg tag "$TAG" --arg region "$AWS_REGION" '{
            commands: [
              "set -euo pipefail",
              "work=\"$(mktemp -d)\"",
              "trap '\''rm -rf \"$work\"'\'' EXIT",
              "aws s3 cp --only-show-errors --recursive --region \($region) s3://\($bucket)/\($tag)/ \"$work/\"",
              "bash \"$work/deploy.sh\" \($tag)"
            ],
            executionTimeout: ["900"]
          }' >"$RUNNER_TEMP/ssm-params.json"

          cmd_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=$INSTANCE_NAME_TAG" \
            --max-concurrency 1 --max-errors 0 \
            --timeout-seconds 60 \
            --comment "deploy ${TAG:0:12}" \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --query Command.CommandId --output text)"
          echo "SSM 명령: $cmd_id"

          # executionTimeout(900초)보다 조금 길게 기다린다
          deadline=$((SECONDS + 960))
          while :; do
            read -r status target_count < <(aws ssm list-commands --command-id "$cmd_id" \
              --query 'Commands[0].[Status,TargetCount]' --output text)
            case "$status" in
              Pending | InProgress | Cancelling) ;;
              *) break ;;
            esac
            if ((SECONDS >= deadline)); then
              echo "::error::SSM 명령이 끝나지 않았습니다 ($status). 서버에서 확인하세요"
              exit 1
            fi
            sleep 5
          done

          if [[ "$target_count" != "1" ]]; then
            echo "::error::Name=$INSTANCE_NAME_TAG 인 대상 인스턴스가 1대가 아닙니다 (대상 $target_count 대, 상태 $status)"
            exit 1
          fi

          instance_id="$(aws ssm list-command-invocations --command-id "$cmd_id" \
            --query 'CommandInvocations[0].InstanceId' --output text)"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$instance_id" \
            --output json >"$RUNNER_TEMP/ssm-result.json"

          echo "::group::deploy.sh 출력"
          jq -r '.StandardOutputContent' "$RUNNER_TEMP/ssm-result.json"
          jq -r '.StandardErrorContent' "$RUNNER_TEMP/ssm-result.json" >&2
          echo "::endgroup::"

          read -r inv_status response_code < <(jq -r '"\(.Status) \(.ResponseCode)"' "$RUNNER_TEMP/ssm-result.json")
          echo "결과: $inv_status (종료 코드 $response_code)"
          if [[ "$inv_status" != "Success" ]]; then
            # 종료 코드 뜻은 deploy.sh 머리 주석 참고 (1 되돌림 / 2 잘못된 입력·설정 / 3 되돌리기도 실패)
            echo "::error::배포 실패 ($inv_status, 종료 코드 $response_code)"
            exit 1
          fi

      - name: 바깥에서 상태 확인
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q '"status":"UP"'; then
              echo "UP: $HEALTH_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$HEALTH_URL 이 UP이 아닙니다"
          exit 1
