name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 자바 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 그래들 설정 (캐시)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 및 테스트
        run: ./gradlew build
