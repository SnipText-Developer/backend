plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sniptext'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.1'
	querydslVersion = '7.7'
	archunitVersion = '1.5.1'
	shedlockVersion = '7.11.0'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 접근 토큰 서명·검증과 구글 ID 토큰 검증을 같은 라이브러리로 처리한다 (리소스 서버 스타터는 쓰지 않는다)
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.flywaydb:flyway-mysql'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	// 배치가 서버 여러 대(배포 중 겹치는 컨테이너 포함)에서 한 번만 돌도록 DB 잠금 테이블로 막는다
	implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
	implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'user.timezone', 'Asia/Seoul'
	// 테스트 전용 서명 키. src/test/resources/application.yml은 운영 설정을 통째로 가리므로 만들지 않는다
	environment 'JWT_SECRET', 'test-only-jwt-secret-do-not-use-anywhere-else'
	// 테스트 전용 본문 암호화 키 (Base64로 인코딩한 32바이트)
	environment 'CONTENT_ENCRYPTION_KEY', 'RipPBY6rYeoR+15yb9ooY0ghmKpl6XwA8XMoAslj0oA='
	// 테스트는 외부를 부르지 않는 가짜 언어 모델을 쓴다 (prod 프로필 테스트는 클래스에서 anthropic으로 덮어쓴다)
	environment 'AI_PROVIDER', 'fake'
	// 테스트 전용 구글 설정 (테스트는 구글에 접속하지 않는다)
	environment 'GOOGLE_CLIENT_ID', 'test-google-client-id'
	environment 'GOOGLE_CLIENT_SECRET', 'test-google-client-secret'
	environment 'GOOGLE_REDIRECT_URIS', 'http://localhost:5173/auth/google/callback'
	// 테스트 전용 허용 출처
	environment 'CORS_ALLOWED_ORIGINS', 'https://sniptext.kr,http://localhost:3000,chrome-extension://abcdefghijklmnopabcdefghijklmnop'
	// 테스트 중에 실제 시각(00:10, 04:00)이 되어 배치가 테스트 데이터를 지우지 않게 스케줄을 끈다.
	// 배치 메서드는 테스트에서 직접 부르고, 잠금(셰드락)은 켜진 그대로 쓴다
	environment 'SNIPTEXT_SCHEDULING_ENABLED', 'false'
}
