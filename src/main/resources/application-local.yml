# 로컬 개발. DB는 도커 컴포즈가 연결한다.
# 아래 서명 키·본문 암호화 키 기본값은 로컬 전용이다. 개발 서버·운영에서는 절대 쓰지 않는다.
spring:
  flyway:
    # 기본값을 통째로 덮어쓰므로 db/migration을 빼면 테이블 생성이 사라진다. db/seed는 개발용 시드 회원
    locations: classpath:db/migration,classpath:db/seed

sniptext:
  jwt:
    secret: ${JWT_SECRET:local-only-jwt-secret-for-sniptext-dev}
  crypto:
    content-key: ${CONTENT_ENCRYPTION_KEY:Mg+PwFGfOYghWGhe9CBZQ7XC46d+ODvtlOAUugqKqWM=}
  # 실제 구글 로그인을 확인하려면 GOOGLE_CLIENT_ID·GOOGLE_CLIENT_SECRET 환경 변수로 진짜 값을 넣는다.
  # redirect-uris 기본값은 임시 주소다. 프론트 로컬 주소가 정해지면 바꾼다
  google:
    client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
    redirect-uris: ${GOOGLE_REDIRECT_URIS:http://localhost:5173/auth/google/callback}
