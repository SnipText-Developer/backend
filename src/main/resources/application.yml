spring:
  application:
    name: sniptext
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

# 하이버네이트가 유니크 위반 때 겹친 값을 WARN으로 남긴다 (Duplicate entry '이메일'). 이메일을 로그에 남기지 않도록 끈다.
# 처리하지 못한 DB 오류는 전역 예외 처리가 ERROR 로그로 남긴다.
logging:
  level:
    org.hibernate.orm.jdbc.error: ERROR

# 운영에서는 Caddy가 https를 받아 앱에 http로 넘긴다. 프록시가 붙인 X-Forwarded-* 헤더로 원래 주소(https)를 판단한다.
# 톰캣은 내부 주소(127.0.0.1, 도커 네트워크 등)에서 온 헤더만 믿는다. 앱 포트는 서버의 127.0.0.1에만 열려 있다.
server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 접근 토큰 서명 키 (32바이트 이상). 기본값이 없어 빠뜨리면 기동에 실패한다.
# 개발 서버와 운영의 키는 반드시 다르게 둔다 (개발 서버 토큰이 운영에서 통하지 않게).
sniptext:
  jwt:
    secret: ${JWT_SECRET}
  # 템플릿 본문 암호화 키 (Base64로 인코딩한 32바이트). 기본값이 없어 빠뜨리면 기동에 실패한다.
  # 개발 서버와 운영의 키는 반드시 다르게 두고, 잃어버리면 저장된 본문을 되살릴 수 없다.
  crypto:
    content-key: ${CONTENT_ENCRYPTION_KEY}
  # 가입 때 동의받는 약관의 현재 버전. 약관이 바뀌면 이 값만 올린다 (본문은 랜딩의 /terms/{버전} 정적 페이지)
  terms:
    current-version: v1
  # 언어 모델 (AI 톤 교정). provider는 anthropic | fake이고 기본값이 없어 빠뜨리면 기동에 실패한다.
  # anthropic이면 키와 모델이 필수이고, prod 프로필에서는 fake로 기동할 수 없다.
  ai:
    provider: ${AI_PROVIDER}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
  # 브라우저에서 API를 부를 수 있는 화면 주소 (쉼표로 구분). 기본값이 없어 빠뜨리면 기동에 실패한다.
  # 자격 증명(재발급 쿠키)을 허용하므로 *는 쓸 수 없다. 크롬 확장은 chrome-extension://확장ID. 프로필별 값은 docs/deploy-design.md 4-10
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # 재발급 토큰 쿠키. 화면과 API가 다른 사이트인 환경만 None으로 바꾼다.
  auth:
    cookie:
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  # 구글 로그인 (인가 코드 교환 + ID 토큰 검증). 아래 세 값은 기본값이 없어 빠뜨리면 기동에 실패한다.
  # redirect-uris는 로그인 뒤 돌아올 화면 주소 허용 목록이다 (쉼표로 구분). 요청의 redirectUri가 여기 없으면 거절한다.
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uris: ${GOOGLE_REDIRECT_URIS}
