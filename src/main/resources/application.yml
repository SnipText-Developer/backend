spring:
  application:
    name: sniptext
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 접근 토큰 서명 키 (32바이트 이상). 기본값이 없어 빠뜨리면 기동에 실패한다.
# 개발 서버와 운영의 키는 반드시 다르게 둔다 (개발 서버 토큰이 운영에서 통하지 않게).
sniptext:
  jwt:
    secret: ${JWT_SECRET}
  # 템플릿 본문 암호화 키 (Base64로 인코딩한 32바이트). 기본값이 없어 빠뜨리면 기동에 실패한다.
  # 개발 서버와 운영의 키는 반드시 다르게 두고, 잃어버리면 저장된 본문을 되살릴 수 없다.
  crypto:
    content-key: ${CONTENT_ENCRYPTION_KEY}
